# FGCシミュレーター ML-Agents 学習設定（PPO・自己対戦）
# 使い方: ml/train.ps1 から `mlagents-learn ml/fgc_ppo.yaml --run-id=fgc_xxx` で起動。
# 観測22次元(自12+最寄り球4+近傍ロボ6)・行動=連続2(並進/旋回)+離散[2,2,2](インテーク/シュート/登攀)。MLAgentController.cs が正典（観測次元はUnity側BehaviorParametersから供給）。
behaviors:
  FgcRobot:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 500000
    max_steps: 20000000
    time_horizon: 256
    summary_freq: 20000
    threaded: true
    # 自己対戦（3v3の対称対戦を学習）
    self_play:
      save_steps: 50000
      team_change: 200000
      swap_steps: 25000
      window: 10
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0
